name: Site check

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-check.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package.json
      - run: npm install
      - run: npm run build
